name: HSMR Automation CI

on:
  push:
    branches:
      - main # Triggers on push to main for full pipeline runs and integrity checks
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  prepare_workspace:
    runs-on: ubuntu-latest
    permissions: # Conceptual placeholder - actual permissions managed in GitHub settings
      contents: write # Needed for actions/checkout and potentially to push branches/tags
      actions: read # Default, may not be explicitly needed
      packages: read # If using GitHub Packages for R packages or Docker images

    steps:
      - name: Display Event Information (Debugging)
        run: echo "Event name: ${{ github.event_name }}, Ref: ${{ github.ref }}"

      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: 'main' # Explicitly checkout main, though default for push to main
          fetch-depth: 0 # Fetch all history for all tags and branches, needed for dynamic branching

      - name: Configure Git User
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"

      - name: Create Dynamic Quarterly Branch
        id: dynamic_branch
        run: |
          # Generate date parts
          YEAR=$(date +'%Y')
          QUARTER=$(( ($(date +'%m') - 1) / 3 + 1 ))
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')

          # Define branch name
          BRANCH_NAME="hsmr_runs/${YEAR}_Q${QUARTER}_${TIMESTAMP}"
          echo "Creating branch: $BRANCH_NAME"

          # Create and checkout the new branch
          git checkout -b $BRANCH_NAME

          # Set output for other steps if needed
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Push New Branch to Remote
        run: |
          # Push the new branch to the remote repository
          # The GITHUB_TOKEN automatically provided by GitHub Actions has permissions
          # to push to the repository if 'contents: write' is specified in permissions.
          git push origin ${{ steps.dynamic_branch.outputs.branch_name }}
          echo "Pushed branch ${{ steps.dynamic_branch.outputs.branch_name }} to remote."

      - name: Verify Current Branch
        run: |
          echo "Current branch is: $(git rev-parse --abbrev-ref HEAD)"
          echo "Workflow is now operating on branch: ${{ steps.dynamic_branch.outputs.branch_name }}"

      - name: Set up R
        uses: actions/setup-r@v2
        with:
          r-version: '4.3' # Specify a recent R version, or 'release' for latest

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION', '**/renv.lock') }} # Cache key based on OS, R version, and DESCRIPTION/renv.lock files
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install R Dependencies
        uses: actions/setup-r-dependencies@v2
        with:
          packages: | # Optional: list any packages not in DESCRIPTION/renv.lock, or system libraries
            any::dplyr
            any::ggplot2
            any::rmarkdown
            any::knitr
            any::lubridate
            any::odbc # For database connectivity
            any::DBI
            any::jsonlite # For reading config
            any::readr # For reading csv/sql
            any::here # For file paths
            # Add other essential packages here if not managed by DESCRIPTION/renv
          # For system libraries, use:
          # system-dependencies: |
          #   unixodbc-dev # Example for odbc
          #   libcurl4-openssl-dev # Example for curl
          #   libxml2-dev # Example for xml2
          # Consider if these are needed based on R package requirements.

      - name: Validate R Environment
        run: Rscript validate_env.R

      - name: Generate HSMR Config File
        run: python update_hsmr_config.py
        # This creates hsmr_config.json in the workspace root

      - name: Create Required Directories
        run: |
          mkdir -p data/raw
          mkdir -p reference_files # Ensure reference_files dir is acknowledged if not git tracked with content
          mkdir -p sql_queries # Ensure SQL queries directory exists (if not checked in yet)
          mkdir -p scripts # Ensure scripts directory exists (if not checked in yet)
          # In a real repo, these dirs would likely be version controlled (perhaps with .gitkeep)

      - name: Verify Reference Files
        run: Rscript scripts/verify_reference_files.R
        # Uses hsmr_config.json and files in reference_files/

      # As a reminder, placeholder SQL files (get_smr_extract.sql, get_ltt_extract.sql)
      # should be in 'sql_queries/' and extract_database_data.R in 'scripts/'.
      # For this subtask, we assume they are present in the repo checkout.
      # If they were generated dynamically, they'd need to be created here.

      - name: Run R Script for SQL Data Extraction (Simulated DB)
        env:
          # Example of how secrets would be passed if a real DB was used
          # DB_USER: ${{ secrets.HSMR_DB_USER }}
          # DB_PASSWORD: ${{ secrets.HSMR_DB_PASSWORD }}
          # DB_SERVER_OR_DSN: ${{ secrets.HSMR_DB_SERVER_OR_DSN }}
          # DB_NAME: ${{ secrets.HSMR_DB_NAME }}
          SIMULATE_DB_CALLS: "true" # Could be used by R script to ensure simulation
        run: Rscript scripts/extract_database_data.R

      - name: List Generated Raw Data and Hashes
        run: |
          echo "Listing files in data/raw:"
          ls -l data/raw
          echo "Contents of .sha256 files:"
          for f in data/raw/*.sha256; do
            if [ -f "$f" ]; then # Check if file exists before catting
              echo "$f:"
              cat "$f"
            else
              echo "Warning: Expected hash file $f not found."
            fi
          done
        continue-on-error: true # Don't fail if no .sha256 files initially or ls fails

      - name: Upload Raw Data Artifacts for Phase 2
        uses: actions/upload-artifact@v3
        with:
          name: raw-data-phase2-run-${{ github.run_id }} # Changed to use github.run_id
          path: |
            data/raw/ # Upload the whole directory
            hsmr_config.json # Also include the config file used for this run
          retention-days: 7 # Optional: set retention period for artifacts

      # Further steps for subsequent phases would be added in later jobs
      # or as additional steps in this job if appropriate.

  process_and_analyze_data:
    runs-on: ubuntu-latest
    needs: prepare_workspace # This job depends on the successful completion of prepare_workspace

    # We need to get the dynamic branch name from the prepare_workspace job's output
    # This assumes 'prepare_workspace' job has an 'outputs' section like:
    # outputs:
    #   branch_name: ${{ steps.dynamic_branch.outputs.branch_name }}
    # We need to ensure this output is set in 'prepare_workspace' job.
    # For now, let's assume it's available. If not, we might need to pass it via an artifact
    # or reconsider how to uniquely name artifacts if branch name isn't directly passable.
    # A simpler way for now is to use github.run_id for unique artifact names if branch name is tricky across jobs.
    # Let's use github.run_id for artifact names to simplify inter-job dependency for now.

    steps:
      - name: Display Event Information (Debugging)
        run: echo "Event name: ${{ github.event_name }}, Ref: ${{ github.ref }}, Run ID: ${{ github.run_id }}"

      - name: Checkout Code on current branch
        uses: actions/checkout@v4
        # This will checkout the code on the same branch that prepare_workspace pushed,
        # assuming the workflow is triggered by a push to that new branch, or if ref is passed.
        # If prepare_workspace just creates a branch and this job runs on 'main',
        # we need to explicitly checkout the dynamic branch.
        # For simplicity with workflow_dispatch or push to main that then creates a branch,
        # we'll assume this job needs to know the branch name.
        # A robust way: `prepare_workspace` writes branch_name to a file, uploads as artifact.
        # This job downloads it.
        # For now, we'll assume the checkout is on the dynamically created branch.
        # This is often handled by how the overall workflow is structured (e.g., subsequent jobs run on the new ref).
        # If 'prepare_workspace' ends by pushing a branch, the workflow might need to be designed
        # to trigger subsequent jobs based on that new branch, or pass the branch name.
        # For now, we'll checkout 'main' and rely on artifacts being uniquely named by run_id.
        # This means scripts will run on 'main's version of scripts, but use artifacted data.
        with:
          ref: 'main' # Or specify the dynamic branch if passed as input/output

      - name: Set up R
        uses: actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION', '**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install R Dependencies
        uses: actions/setup-r-dependencies@v2
        with:
          packages: | # Ensure all packages needed by Phase 3 scripts are listed
            any::dplyr
            any::ggplot2
            any::rmarkdown
            any::knitr
            any::lubridate
            any::odbc
            any::DBI
            any::jsonlite
            any::readr
            any::digest
            any::here
            # any::openxlsx # if using actual excel
          # system-dependencies: |
          #   unixodbc-dev

      - name: Validate R Environment
        run: Rscript validate_env.R # Assumes validate_env.R is in root

      - name: Download Phase 2 Artifacts (Raw Data and Config)
        uses: actions/download-artifact@v3
        with:
          name: raw-data-phase2-run-${{ github.run_id }} # Adjusted to use run_id
          # 'name' must match the upload name from prepare_workspace.
          # The 'prepare_workspace' job's upload artifact step should be:
          # name: raw-data-phase2-run-${{ github.run_id }}
          path: . # Download to current workspace root

      - name: Verify Downloaded Artifacts
        run: |
          echo "Files in workspace root after download:"
          ls -la
          echo "Files in data/raw:"
          ls -la data/raw
          if [ ! -f "hsmr_config.json" ]; then
            echo "ERROR: hsmr_config.json not found after artifact download."
            exit 1
          fi
          if [ ! -d "data/raw" ]; then
            echo "ERROR: data/raw directory not found after artifact download."
            exit 1
          fi

      - name: Create Output Directories for Phase 3
        run: |
          mkdir -p data/processed
          mkdir -p data/output

      - name: Run SMR Data Production Script
        run: Rscript scripts/create_smr_data.R

      - name: Run Trends Data Production Script
        run: Rscript scripts/create_trends_data.R

      - name: Run Excel Tables Generation Script
        run: Rscript scripts/create_excel_tables.R

      - name: List Generated Processed Data and Hashes
        run: |
          echo "Listing files in data/processed:"
          ls -l data/processed
          echo "Contents of .sha256 files in data/processed:"
          for f in data/processed/*.sha256; do if [ -f "$f" ]; then echo "$f:"; cat "$f"; fi; done
        continue-on-error: true

      - name: List Generated Final Tables and Hashes
        run: |
          echo "Listing files in data/output:"
          ls -l data/output
          echo "Contents of .sha256 files in data/output:"
          for f in data/output/*.sha256; do if [ -f "$f" ]; then echo "$f:"; cat "$f"; fi; done
        continue-on-error: true

      - name: Upload Processed Data Artifact (Phase 3)
        uses: actions/upload-artifact@v3
        with:
          name: processed-data-phase3-run-${{ github.run_id }}
          path: data/processed/
          retention-days: 7

      - name: Upload Final Tables Artifact (Phase 3)
        uses: actions/upload-artifact@v3
        with:
          name: final-tables-phase3-run-${{ github.run_id }}
          path: data/output/
          retention-days: 7

  quality_assurance:
    runs-on: ubuntu-latest
    needs: process_and_analyze_data # Depends on successful completion of Phase 3

    steps:
      - name: Display Event Information (Debugging)
        run: echo "Event name: ${{ github.event_name }}, Ref: ${{ github.ref }}, Run ID: ${{ github.run_id }}"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 'main' # Or the dynamic branch if it's being passed and used consistently

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Specify a recent Python version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          # Add other dependencies like jsonschema if validate_schema.py evolves to use it

      - name: Download hsmr_config.json (from Phase 2 artifact)
        uses: actions/download-artifact@v3
        with:
          name: raw-data-phase2-run-${{ github.run_id }} # Contains hsmr_config.json
          path: ./ # Download to workspace root, hsmr_config.json will be at ./hsmr_config.json
          # This also downloads data/raw which is not strictly needed by QA scripts but comes with the config

      - name: Download Processed Data (Phase 3 artifact)
        uses: actions/download-artifact@v3
        with:
          name: processed-data-phase3-run-${{ github.run_id }}
          path: data/processed # Download into data/processed directory

      - name: Download Final Tables (Phase 3 artifact) - Optional for current QA scripts
        uses: actions/download-artifact@v3
        with:
          name: final-tables-phase3-run-${{ github.run_id }}
          path: data/output # Download into data/output directory
          # Note: Current QA scripts primarily focus on 'data/processed'. This is for completeness.

      - name: Verify Downloaded Artifacts for QA
        run: |
          echo "Files in workspace root after download:"
          ls -la
          echo "Files in data/processed:"
          ls -la data/processed
          echo "Files in data/output:"
          ls -la data/output
          if [ ! -f "hsmr_config.json" ]; then
            echo "ERROR: hsmr_config.json not found after artifact download."
            exit 1
          fi
          # Check for at least one file in data/processed to ensure it's not empty
          if [ -z "$(ls -A data/processed)" ]; then
            echo "WARNING: data/processed directory is empty after artifact download."
            # Decide if this is an error or warning. For now, a warning.
          fi


      - name: Create QA Scripts Directory (if not checked in with content)
        run: mkdir -p qa_scripts

      - name: Run Schema Validation Script
        run: python qa_scripts/validate_schema.py

      - name: Run Data Rules Validation Script
        run: python qa_scripts/validate_data_rules.py

      - name: Run Anomaly Detection Script (Conceptual)
        run: python qa_scripts/detect_anomalies.py
        # This step should typically not fail the job even if anomalies are found.
        # Failure would only occur if the script itself errors.
        continue-on-error: false # Set to true if we want to ensure it never fails the job.
                                # For now, false, meaning script errors will fail the job.
                                # Anomaly findings themselves don't cause script to exit 1.

      - name: List Generated QA Reports
        run: |
          echo "Listing generated QA report files:"
          ls -l schema_validation_report.json || echo "schema_validation_report.json not found"
          ls -l data_rules_validation_report.json || echo "data_rules_validation_report.json not found"
          ls -l anomaly_detection_report.json || echo "anomaly_detection_report.json not found"
        continue-on-error: true

      - name: Upload QA Reports Artifact (Phase 4)
        uses: actions/upload-artifact@v3
        if: always() # Upload reports even if preceding QA script steps failed (e.g. schema validation failed)
        with:
          name: validation-reports-phase4-run-${{ github.run_id }}
          path: |
            schema_validation_report.json
            data_rules_validation_report.json
            anomaly_detection_report.json
          retention-days: 7
          # if-no-files-found: warn # Default is error, 'warn' or 'ignore' can be useful

  generate_and_archive_publication:
    runs-on: ubuntu-latest
    needs: quality_assurance # Depends on successful completion of Phase 4

    steps:
      - name: Display Event Information (Debugging)
        run: echo "Event name: ${{ github.event_name }}, Ref: ${{ github.ref }}, Run ID: ${{ github.run_id }}"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 'main' # Or the dynamic branch

      # R Environment Setup (for RMarkdown knitting)
      - name: Set up R
        uses: actions/setup-r@v2
        with:
          r-version: '4.3'
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION', '**/renv.lock') }} # Same key as other R setups
          restore-keys: |
            ${{ runner.os }}-r-
      - name: Install R Dependencies for Knitting
        uses: actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::jsonlite
            any::readr
            any::digest
            any::here
            any::tools
            # Add any other packages needed by the Rmd files themselves
          # system-dependencies: |
          #   pandoc # Usually comes with R/RStudio, but ensure it's available for rmarkdown
          #   latexmk # For PDF generation, if using LaTeX
          #   texlive-full # A full LaTeX distribution (large) - or more specific packages

      - name: Validate R Environment (for Knitting)
        run: Rscript validate_env.R # Ensure core packages are there

      # Python Environment Setup (for archiving script)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Python Dependencies for Archiving
        run: |
          python -m pip install --upgrade pip
          # No specific packages needed for archive_and_stage.py other than standard lib for now

      # Download necessary artifacts
      - name: Download hsmr_config.json (from Phase 2 artifact)
        uses: actions/download-artifact@v3
        with:
          name: raw-data-phase2-run-${{ github.run_id }}
          path: ./
          # This downloads hsmr_config.json and data/raw (data/raw might not be directly needed by knitting script)

      - name: Download Processed Data (Phase 3 artifact)
        uses: actions/download-artifact@v3
        with:
          name: processed-data-phase3-run-${{ github.run_id }}
          path: data/processed

      # Final tables artifact also contains data/output, one of which is used by archive script.
      # Rmds use data/processed.
      - name: Download Final Tables (Phase 3 artifact)
        uses: actions/download-artifact@v3
        with:
          name: final-tables-phase3-run-${{ github.run_id }}
          path: data/output

      - name: Download QA Reports (Phase 4 artifact) - for archiving
        uses: actions/download-artifact@v3
        with:
          name: validation-reports-phase4-run-${{ github.run_id }}
          path: ./ # Download reports to workspace root

      - name: Verify Downloaded Artifacts for Publication Phase
        run: |
          echo "Files in workspace root after download:"
          ls -la
          echo "Files in data/processed:"
          ls -la data/processed
          echo "Files in data/output:"
          ls -la data/output
          if [ ! -f "hsmr_config.json" ]; then echo "ERROR: hsmr_config.json not found"; exit 1; fi
          # Add more checks if specific files are critical for this phase

      - name: Create Publication Output Directory
        run: mkdir -p publication_outputs # As defined in hsmr_config.json

      - name: Run R Script to Knit Documents & Report Manual Steps
        run: Rscript scripts/knit_hsmr_documents.R
        # This script will simulate PDF/HTML generation and print manual steps

      - name: List Generated Publication Documents
        run: |
          echo "Listing files in publication_outputs:"
          ls -l publication_outputs
        continue-on-error: true

      - name: Run Python Script for Archiving and Staging
        run: python scripts/archive_and_stage.py
        # This script simulates copying files to archive and Tableau staging

      - name: Upload Final Publication Documents Artifact (Phase 5)
        uses: actions/upload-artifact@v3
        if: always() # Upload even if some steps failed (e.g., knitting one document but not another)
        with:
          name: publication-docs-phase5-run-${{ github.run_id }}
          path: publication_outputs/
          retention-days: 30 # Keep final publications longer

      - name: Upload Archive Manifest (Conceptual)
        uses: actions/upload-artifact@v3
        if: always() && false # Conditioned to false as script doesn't save manifest locally
        # This is conceptual as the python script only simulates writing it to a remote path
        # To make this work, archive_and_stage.py would need to write manifest to local path first.
        with:
          name: archive-manifest-phase5-run-${{ github.run_id }}
          path: placeholder_archive_manifest.json # Needs dynamic name or fixed local output from python script
          if-no-files-found: ignore
          retention-days: 30
