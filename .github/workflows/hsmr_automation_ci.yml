name: HSMR Automation CI

on:
  push:
    branches:
      - main # Triggers on push to main for full pipeline runs and integrity checks
  workflow_dispatch:
    inputs:
      target_year:
        description: 'Target Year (e.g., 2023). Leave blank for default (previous quarter).'
        required: false
        type: string
      target_quarter:
        description: 'Target Quarter (1-4). Leave blank for default.'
        required: false
        type: string

jobs:
  prepare_workspace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: read
    outputs:
      publication_reference_period: ${{ steps.hsmr_config_generation.outputs.publication_reference_period }}
      branch_name: ${{ steps.dynamic_branch.outputs.branch_name }}

    steps:
      - name: Display Event Information (Debugging)
        run: echo "Event name: ${{ github.event_name }}, Ref: ${{ github.ref }}"

      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: 'main'
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"

      - name: Create Dynamic Quarterly Branch
        id: dynamic_branch
        run: |
          YEAR=$(date +'%Y')
          QUARTER=$(( ($(date +'%m') - 1) / 3 + 1 ))
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          BRANCH_NAME="hsmr_runs/${YEAR}_Q${QUARTER}_${TIMESTAMP}"
          echo "Creating branch: $BRANCH_NAME"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Push New Branch to Remote
        run: |
          git push origin ${{ steps.dynamic_branch.outputs.branch_name }}
          echo "Pushed branch ${{ steps.dynamic_branch.outputs.branch_name }} to remote."

      - name: Verify Current Branch
        run: |
          echo "Current branch is: $(git rev-parse --abbrev-ref HEAD)"
          echo "Workflow is now operating on branch: ${{ steps.dynamic_branch.outputs.branch_name }}"

      - name: Set up R
        uses: actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION', '**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install R Dependencies
        uses: actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::ggplot2
            any::rmarkdown
            any::knitr
            any::lubridate
            any::odbc
            any::DBI
            any::jsonlite
            any::readr
            any::here
          system-dependencies: |
             unixodbc-dev
             libxml2-dev
             zlib1g-dev
             pandoc

      - name: Validate R Environment
        id: validate_r_env_step
        run: Rscript validate_env.R

      - name: Generate HSMR Config File
        id: hsmr_config_generation
        run: python update_hsmr_config.py

      - name: Create Required Directories
        run: |
          mkdir -p data/raw
          mkdir -p reference_files
          mkdir -p sql_queries
          mkdir -p scripts
          mkdir -p qa_scripts

      - name: Verify Reference Files
        run: Rscript scripts/verify_reference_files.R

      - name: Run R Script for SQL Data Extraction
        env:
          HSMR_DB_USER: ${{ secrets.HSMR_DB_USER }}
          HSMR_DB_PASSWORD: ${{ secrets.HSMR_DB_PASSWORD }}
          HSMR_DB_SERVER_OR_DSN: ${{ secrets.HSMR_DB_SERVER_OR_DSN }}
          HSMR_DB_DATABASE_NAME: ${{ secrets.HSMR_DB_DATABASE_NAME }}
          HSMR_DB_DRIVER: ${{ secrets.HSMR_DB_DRIVER }}
          HSMR_DB_PORT: ${{ secrets.HSMR_DB_PORT }}
        run: Rscript scripts/extract_database_data.R

      - name: List Generated Raw Data and Hashes
        run: |
          echo "Listing files in data/raw:"
          ls -l data/raw
          echo "Contents of .sha256 files:"
          for f in data/raw/*.sha256; do
            if [ -f "$f" ]; then
              echo "$f:"; cat "$f"
            else
              echo "Warning: Expected hash file $f not found."
            fi
          done
        continue-on-error: true

      - name: Upload Raw Data Artifacts for Phase 2
        uses: actions/upload-artifact@v3
        with:
          name: raw-data-phase2-run-${{ github.run_id }}
          path: |
            data/raw/
            hsmr_config.json
          retention-days: 7

  process_and_analyze_data:
    runs-on: ubuntu-latest
    needs: prepare_workspace
    steps:
      - name: Display Event Information (Debugging)
        run: echo "Event name: ${{ github.event_name }}, Ref: ${{ github.ref }}, Run ID: ${{ github.run_id }}"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Set up R
        uses: actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION', '**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install R Dependencies for Analysis
        uses: actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr; any::ggplot2; any::rmarkdown; any::knitr; any::lubridate;
            any::odbc; any::DBI; any::jsonlite; any::readr; any::digest; any::here;
            any::openxlsx; any::tools; any::logger
          system-dependencies: |
            libxml2-dev
            zlib1g-dev
            unixodbc-dev
            pandoc

      - name: Validate R Environment for Analysis
        run: Rscript validate_env.R

      - name: Download Phase 2 Artifacts (Raw Data and Config)
        uses: actions/download-artifact@v3
        with:
          name: raw-data-phase2-run-${{ github.run_id }}
          path: .

      - name: Verify Downloaded Artifacts for Analysis
        run: |
          echo "Files in workspace root after download:"
          ls -la
          echo "Files in data/raw:"
          ls -la data/raw
          if [ ! -f "hsmr_config.json" ]; then echo "ERROR: hsmr_config.json not found"; exit 1; fi
          if [ ! -d "data/raw" ]; then echo "ERROR: data/raw directory not found"; exit 1; fi

      - name: Create Output Directories for Phase 3
        run: |
          mkdir -p data/processed
          mkdir -p data/output

      - name: Run SMR Data Production Script
        run: Rscript scripts/create_smr_data.R
      - name: Check SMR Data Output Files
        shell: bash -e {0}
        run: |
          PROCESSED_DIR="data/processed"; SMR_OUTPUT_FILE=$(ls $PROCESSED_DIR/smr_output_*.csv); SMR_HASH_FILE="${SMR_OUTPUT_FILE}.sha256"
          if [ ! -f "$SMR_OUTPUT_FILE" ] || [ ! -s "$SMR_OUTPUT_FILE" ]; then echo "ERROR: SMR CSV missing or empty: $SMR_OUTPUT_FILE"; exit 1; fi; echo "SMR CSV OK: $SMR_OUTPUT_FILE"
          if [ ! -f "$SMR_HASH_FILE" ] || [ ! -s "$SMR_HASH_FILE" ]; then echo "ERROR: SMR Hash missing or empty: $SMR_HASH_FILE"; exit 1; fi; echo "SMR Hash OK: $SMR_HASH_FILE"

      - name: Run Trends Data Production Script
        run: Rscript scripts/create_trends_data.R
      - name: Check Trends Data Output Files
        shell: bash -e {0}
        run: |
          PROCESSED_DIR="data/processed"; TRENDS_OUTPUT_FILE=$(ls $PROCESSED_DIR/trends_output_*.csv); TRENDS_HASH_FILE="${TRENDS_OUTPUT_FILE}.sha256"
          if [ ! -f "$TRENDS_OUTPUT_FILE" ] || [ ! -s "$TRENDS_OUTPUT_FILE" ]; then echo "ERROR: Trends CSV missing or empty: $TRENDS_OUTPUT_FILE"; exit 1; fi; echo "Trends CSV OK: $TRENDS_OUTPUT_FILE"
          if [ ! -f "$TRENDS_HASH_FILE" ] || [ ! -s "$TRENDS_HASH_FILE" ]; then echo "ERROR: Trends Hash missing or empty: $TRENDS_HASH_FILE"; exit 1; fi; echo "Trends Hash OK: $TRENDS_HASH_FILE"

      - name: Run Excel Tables Generation Script
        run: Rscript scripts/create_excel_tables.R
      - name: Check Excel Tables Output Files
        shell: bash -e {0}
        run: |
          OUTPUT_DIR="data/output"; EXCEL_OUTPUT_FILE=$(ls $OUTPUT_DIR/final_hsmr_tables_*.xlsx); EXCEL_HASH_FILE="${EXCEL_OUTPUT_FILE}.sha256"
          if [ ! -f "$EXCEL_OUTPUT_FILE" ] || [ ! -s "$EXCEL_OUTPUT_FILE" ]; then echo "ERROR: Excel file missing or empty: $EXCEL_OUTPUT_FILE"; exit 1; fi; echo "Excel file OK: $EXCEL_OUTPUT_FILE"
          if [ ! -f "$EXCEL_HASH_FILE" ] || [ ! -s "$EXCEL_HASH_FILE" ]; then echo "ERROR: Excel Hash missing or empty: $EXCEL_HASH_FILE"; exit 1; fi; echo "Excel Hash OK: $EXCEL_HASH_FILE"

      - name: List Generated Processed Data and Hashes
        run: |
          echo "Listing files in data/processed:"; ls -l data/processed
          echo "Contents of .sha256 files in data/processed:"; for f in data/processed/*.sha256; do if [ -f "$f" ]; then echo "$f:"; cat "$f"; fi; done
        continue-on-error: true

      - name: List Generated Final Tables and Hashes
        run: |
          echo "Listing files in data/output:"; ls -l data/output
          echo "Contents of .sha256 files in data/output:"; for f in data/output/*.sha256; do if [ -f "$f" ]; then echo "$f:"; cat "$f"; fi; done
        continue-on-error: true

      - name: Upload Processed Data Artifact (Phase 3)
        uses: actions/upload-artifact@v3
        with:
          name: processed-data-phase3-run-${{ github.run_id }}
          path: data/processed/
          retention-days: 7

      - name: Upload Final Tables Artifact (Phase 3)
        uses: actions/upload-artifact@v3
        with:
          name: final-tables-phase3-run-${{ github.run_id }}
          path: data/output/
          retention-days: 7

  quality_assurance:
    runs-on: ubuntu-latest
    needs: process_and_analyze_data

    steps:
      - name: Display Event Information (Debugging)
        run: echo "Event name: ${{ github.event_name }}, Ref: ${{ github.ref }}, Run ID: ${{ github.run_id }}"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Download hsmr_config.json (from Phase 2 artifact)
        uses: actions/download-artifact@v3
        with:
          name: raw-data-phase2-run-${{ github.run_id }}
          path: ./

      - name: Download Processed Data (Phase 3 artifact)
        uses: actions/download-artifact@v3
        with:
          name: processed-data-phase3-run-${{ github.run_id }}
          path: data/processed
      - name: Download Final Tables (Phase 3 artifact)
        uses: actions/download-artifact@v3
        with:
          name: final-tables-phase3-run-${{ github.run_id }}
          path: data/output

      - name: Verify Downloaded Artifacts for QA
        run: |
          ls -la; echo "---data/processed:---"; ls -la data/processed; echo "---data/output:---"; ls -la data/output
          if [ ! -f "hsmr_config.json" ]; then echo "ERROR: hsmr_config.json not found"; exit 1; fi
          if [ -z "$(ls -A data/processed)" ]; then echo "WARNING: data/processed directory is empty"; fi

      - name: Create QA Scripts Directory (if not checked in with content)
        run: mkdir -p qa_scripts

      - name: Run Schema Validation Script
        run: python qa_scripts/validate_schema.py

      - name: Run Data Rules Validation Script
        run: python qa_scripts/validate_data_rules.py

      - name: Run Anomaly Detection Script (Conceptual)
        run: python qa_scripts/detect_anomalies.py
        continue-on-error: false

      - name: List Generated QA Reports
        run: |
          ls -l schema_validation_report.json || echo "schema_validation_report.json not found"
          ls -l data_rules_validation_report.json || echo "data_rules_validation_report.json not found"
          ls -l anomaly_detection_report.json || echo "anomaly_detection_report.json not found"
        continue-on-error: true

      - name: Upload QA Reports Artifact (Phase 4)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: validation-reports-phase4-run-${{ github.run_id }}
          path: |
            schema_validation_report.json
            data_rules_validation_report.json
            anomaly_detection_report.json
          retention-days: 7
          if-no-files-found: warn

  generate_publication_documents:
    runs-on: ubuntu-latest
    needs: quality_assurance

    steps:
      - name: Display Event Information (Debugging)
        run: echo "Event name: ${{ github.event_name }}, Ref: ${{ github.ref }}, Run ID: ${{ github.run_id }}"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Set up R
        uses: actions/setup-r@v2
        with:
          r-version: '4.3'
      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/DESCRIPTION', '**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-r-
      - name: Install R Dependencies for Knitting
        uses: actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown; any::knitr; any::jsonlite; any::readr;
            any::digest; any::here; any::logger; any::tools
          system-dependencies: |
            pandoc

      - name: Validate R Environment (for Knitting)
        run: Rscript validate_env.R

      - name: Download hsmr_config.json (from Phase 2 artifact)
        uses: actions/download-artifact@v3
        with:
          name: raw-data-phase2-run-${{ github.run_id }}
          path: ./
      - name: Download Processed Data (Phase 3 artifact)
        uses: actions/download-artifact@v3
        with:
          name: processed-data-phase3-run-${{ github.run_id }}
          path: data/processed

      - name: Verify Downloaded Artifacts for Knitting
        run: |
          ls -la
          if [ ! -f "hsmr_config.json" ]; then echo "ERROR: hsmr_config.json not found"; exit 1; fi
          if [ ! -d "data/processed" ]; then echo "ERROR: data/processed not found"; exit 1; fi

      - name: Create Publication Output Directory
        run: mkdir -p publication_outputs

      - name: Run R Script to Knit Documents & Report Manual Steps
        env:
          SIMULATE_KNITTING: "TRUE"
        run: Rscript scripts/knit_hsmr_documents.R

      - name: List Generated Publication Documents
        run: |
          echo "Listing files in publication_outputs:"
          ls -lR publication_outputs
        continue-on-error: true

      - name: Upload Publication Documents and Checklist for Review (Phase 5 Artifact)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: publication-outputs-for-review-run-${{ github.run_id }}
          path: publication_outputs/
          retention-days: 7

  archive_and_stage_approved_publication:
    runs-on: ubuntu-latest
    needs: generate_publication_documents
    environment:
      name: HSMR_Pre_Archival_Review
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    permissions: # Permissions needed for OIDC with AWS
      id-token: write
      contents: read # For actions/checkout

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Python Dependencies for Archiving
        run: |
          python -m pip install --upgrade pip
          pip install boto3 # Added boto3 for S3 operations

      - name: Download hsmr_config.json (from Phase 2 artifact)
        uses: actions/download-artifact@v3
        with:
          name: raw-data-phase2-run-${{ github.run_id }}
          path: ./
      - name: Download Raw Data (Phase 2)
        uses: actions/download-artifact@v3
        with:
          name: raw-data-phase2-run-${{ github.run_id }}
          path: ./
      - name: Download Processed Data (Phase 3)
        uses: actions/download-artifact@v3
        with:
          name: processed-data-phase3-run-${{ github.run_id }}
          path: data/processed
      - name: Download Final Tables (Phase 3)
        uses: actions/download-artifact@v3
        with:
          name: final-tables-phase3-run-${{ github.run_id }}
          path: data/output
      - name: Download QA Reports (Phase 4)
        uses: actions/download-artifact@v3
        with:
          name: validation-reports-phase4-run-${{ github.run_id }}
          path: ./
      - name: Download Publication Documents for Archiving
        uses: actions/download-artifact@v3
        with:
          name: publication-outputs-for-review-run-${{ github.run_id }}
          path: publication_outputs

      - name: Verify All Necessary Artifacts for Archiving
        run: |
          ls -lR
          if [ ! -f "hsmr_config.json" ]; then echo "ERROR: hsmr_config.json not found"; exit 1; fi

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.HSMR_AWS_IAM_ROLE_FOR_ARCHIVING }}
          aws-region: ${{ secrets.HSMR_AWS_REGION }} # e.g., eu-west-2
          # role-session-name: HSMRGHARun-${{ github.run_id }} # Optional

      - name: Run Python Script for Archiving and Staging
        env:
          HSMR_S3_ARCHIVE_BUCKET: ${{ secrets.HSMR_S3_ARCHIVE_BUCKET }}
          HSMR_S3_TABLEAU_BUCKET: ${{ secrets.HSMR_S3_TABLEAU_BUCKET }}
          # AWS_DEFAULT_REGION is set by configure-aws-credentials step
          # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN are set by configure-aws-credentials
        run: python scripts/archive_and_stage.py

      - name: Upload Archive Manifest (if created locally)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: archive-manifest-phase5-run-${{ github.run_id }}
          path: archive_manifest_*.json
          if-no-files-found: warn
          retention-days: 30
